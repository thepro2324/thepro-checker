<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL | THEPRO CHECKER</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* מטריקס ברקע */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .login-box {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #0f0;
            padding: 40px;
            box-shadow: 0 0 20px #0f0;
            text-align: center;
            border-radius: 10px;
        }

        input {
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }

        .btn {
            background: #0f0;
            color: #000;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        #secret-content {
            display: none; /* מוסתר בהתחלה */
        }

        img { width: 100px; filter: drop-shadow(0 0 5px #0f0); }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="login-box" id="login-form">
    <img src="icon.png" alt="Logo"><br>
    <h2>ACCESS RESTRICTED</h2>
    <p>הכנס קוד גישה:</p>
    <input type="password" id="pass-input" placeholder="****">
    <br>
    <button class="btn" onclick="checkPass()">ENTER</button>
</div>

<div class="login-box" id="secret-content">
    <h1>ACCESS GRANTED</h1>
    <p>ברוך הבא, המערכת מוכנה להורדה.</p>
    <img src="icon.png" alt="Logo"><br><br>
    <a href="https://drive.google.com/uc?export=download&id=1k4ZkOtFILwUOJGy4A4_LRVRgEtZMYqKy" 
       style="text-decoration: none; color: #000; background: #0f0; padding: 15px 30px; font-weight: bold; border-radius: 5px;">
       DOWNLOAD PACKAGE (ZIP)
    </a>
</div>

<script>
    // מערכת בדיקת סיסמה
    function checkPass() {
        const pass = document.getElementById('pass-input').value;
        const correctPass = "1234"; // שנה כאן את הסיסמה למה שאתה רוצה!

        if (pass === correctPass) {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('secret-content').style.display = 'block';
        } else {
            alert("ACCESS DENIED - WRONG CODE");
        }
    }

    // קוד המטריקס ברקע
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0";
        ctx.font = fontSize + "px arial";
        for (let i = 0; i < drops.length; i++) {
            const text = letters[Math.floor(Math.random() * letters.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 33);
</script>

</body>
</html>
